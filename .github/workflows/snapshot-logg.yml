name: Snapshot-logg — alle byer, begge markeder

# Henter værvarsler fra Open-Meteo og bøttepriser fra Polymarkets Gamma-API for
# 21 byer, og skriver dem til Postgres. Den tolker ingenting og bestemmer
# ingenting — den skriver ned hva modellene sa og hva bøttene kostet.
#
# HVORFOR DEN HASTER. Open-Meteo gir ikke ut gamle varsler, og Gamma gir ikke ut
# gamle priser. Alt som ikke lagres i det øyeblikket det finnes, kan ikke hentes
# inn igjen — ikke for penger, ikke med et bedre skript. Hver time uten denne
# jobben er en time data som er borte for godt.
#
# ── `--bare-base` MÅ STÅ ──────────────────────────────────────────────────
#
# Uten det flagget skriver loggeren en redusert form til
# `data/snapshots/<dato>.ndjson`. I dette repoet ville hver lesning dermed blitt
# publisert automatisk. Dataene hører hjemme i Postgres, som er privat.
#
# Derfor er det heller ingen commit-steg her, og `permissions` er `contents:
# read`: det finnes ingenting å committe, og en jobb med skrivetilgang som ikke
# trenger den skal ikke stå.
#
# ── HVORFOR IKKE `--minst-minutter` ───────────────────────────────────────
#
# Loggeren har en vakt som hopper over kjøringen hvis forrige runde er for fersk.
# Den leser dagsfilen for å vite når det var. Med `--bare-base` skrives filen
# aldri, så vakten vet aldri noe og henter alltid — den ville stått her som et
# vern som ikke finnes, og det er verre enn ikke å ha den. Kadensen styres i
# stedet utenfra, se under.

on:
  schedule:
    # RESERVE, ikke hovedkilden. Frekvensen drives utenfra: en cron-tjeneste
    # pirker et endepunkt som gjør `workflow_dispatch` mot denne filen. En
    # dispatch køes som et vanlig API-kall, mens PLANLAGTE kjøringer på et travelt
    # repo hoppes over uten beskjed — målt: fire ganger så mange cron-tidspunkt ga
    # bare 1,4 ganger så mange kjøringer.
    #
    # Faller cron-tjenesten bort, er én lesning i timen langt bedre enn null, og
    # det er nøyaktig hva reserven er til for.
    #
    # Minuttet ligger unna hel og halv time, som er plattformens travleste.
    - cron: "22 * * * *"
  workflow_dispatch: {}

# Leser bare sin egen utsjekk. Ingenting skrives tilbake til repoet.
permissions:
  contents: read

concurrency:
  group: snapshot-logg
  cancel-in-progress: false

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Kjøres direkte med Nodes --experimental-strip-types. Ingen
          # avhengigheter, ingen package.json, ingen npm install: koden
          # importerer bare `node:`-innebygde moduler.
          node-version: "22"

      - name: Hent og lagre denne timens snapshots
        # To dager fram. Markedene listes typisk 1–2 dager i forveien, så dette
        # fanger et marked fra det øyeblikket det dukker opp.
        run: >-
          node --experimental-strip-types runtime/snapshot-logg.ts --dager 2
          --bare-base
        env:
          # ── DETTE REPOET HAR INGEN DATABASENØKKEL ────────────────────────
          #
          # Radene sendes til `/api/snapshot-trigger`, som holder databasenøkkelen i
          # Vercels servermiljø og validerer hver rad mot skjemaet før den
          # skriver. Dette repoet har bare en tilfeldig hemmelighet, og den kan
          # ikke brukes til noe annet enn å legge til snapshot-rader.
          #
          # HVORFOR IKKE EN DATABASENØKKEL DIREKTE. Planen var en egen
          # Postgres-rolle med `insert` bare på snapshot-tabellene, båret av en
          # JWT vi signerte selv. Den falt: Supabase-prosjektet er gått over til
          # asymmetriske signeringsnøkler, og den private nøkkelen holdes av
          # Supabase. Egne tokens kan altså ikke signeres i det hele tatt.
          #
          # Ruta er strengere enn rollen ville vært. En databaserolle kan
          # begrense HVILKE TABELLER som skrives, men ikke se på innholdet.
          # Ruta gjør begge deler.
          SNAPSHOT_PROXY_URL: ${{ secrets.SNAPSHOT_PROXY_URL }}
          SNAPSHOT_PROXY_SECRET: ${{ secrets.SNAPSHOT_PROXY_SECRET }}
